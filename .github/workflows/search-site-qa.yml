name: CapturePort website search and conversion QA

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  search-site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify search crawl, official product facts and conversion links
        run: node scripts/check-search-site.mjs
